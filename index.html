<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img {
            width: 700px;
            height: 500px;
            position: relative;
            margin: 100px auto;
            overflow: hidden;


            >figure {

                box-shadow: 2px 5px 10px 15px rgb(122, 66, 201);
                width: 90%;
                border: 3px solid black;
                height: 100%;
                position: absolute;
                top: 0;
                opacity: 0;
                animation: 15s linear infinite;

                &:nth-of-type(1) {
                    animation-name: img1;
                }

                &:nth-of-type(2) {
                    animation-name: img2;
                }

                &:nth-of-type(3) {
                    animation-name: img3;
                }

                >img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }

                figcaption {
                    width: 100%;
                    height: 70px;
                    background-color: rgba(0, 0, 0, 0.589);
                    color: rgb(191, 188, 188);
                    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
                    font-size: 25px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    position: absolute;
                    bottom: 20px;
                    box-shadow: 2px 5px 10px 15px rgb(255, 0, 0);
                    opacity: 1;
                    animation: tex 5s linear infinite;

                }
            }
        }

        .back {
            background-image: linear-gradient(red, blue);
        }

        @keyframes img1 {
            0% {
                opacity: 1;
            }

            31% {
                opacity: 1;
            }

            35% {
                left: opacity:0;
            }

            35.0001% {
                opacity: 0;
            }

            96% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes img2 {
            31% {
                opacity: 0;
            }

            35% {
                opacity: 1;
            }

            64% {
                opacity: 1;
            }

            68% {
                opacity: 0;
            }

            68.0001% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes img3 {
            0% {
                opacity: 0;
            }

            64% {
                opacity: 0;
            }

            68% {
                opacity: 1;
            }

            96% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes tex {

            0%,
            30%,
            80%,
            100% {
                opacity: 0;
            }

            40%,
            70% {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="back">
    <div class="img">
        <figure>
            <img src="1 image.jfif" alt="">
            <figcaption>juggernaut Dota2</figcaption>
        </figure>
        <figure>
            <img src="images2.jfif" alt="">
            <figcaption>Dota2 Game</figcaption>
        </figure>
        <figure>
            <img src="images3.jfif" alt="">
            <figcaption>wlc to Dota2</figcaption>
        </figure>
    </div>
</body>

</html>
